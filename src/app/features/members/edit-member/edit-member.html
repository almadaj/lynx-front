<div class="page">
    <div class="header">
        <button class="back-button" (click)="handleBackButton()">
            ←
        </button>
        <h1>Editar membro</h1>
    </div>

    <div class="profile-card">
        @if (this.user()?.profilePhoto) {
        <img [src]="this.user()?.profilePhoto" class="avatar">
        } @else {
        <img src="https://i.pravatar.cc/180" class="avatar">
        }
        <div class="info">
            <h2>{{ user()?.name || '-' }}</h2>
            <p>{{ user()?.email || '-' }}</p>
            <div class="role">
                <label>{{ this.user()?.companies?.[0]?.role || '-' }} @ {{ this.user()?.companies?.[0]?.companyName ||
                    '-' }}</label>
                <select>
                    <option>Professor</option>
                    <option>Coordenador</option>
                    <option>Diretor</option>
                </select>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Turmas</h2>
            <button>
                + Alocar em turma
            </button>
        </div>

        <div class="class-list">
            <div class="class-card">
                <div>
                    <h3>3º Ano A</h3>
                    <span>28 alunos</span>
                </div>
                <button class="remove">
                    Remover
                </button>
            </div>

            <div class="class-card">
                <div>
                    <h3>2º Ano B</h3>
                    <span>31 alunos</span>
                </div>

                <button class="remove">
                    Remover
                </button>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="cancel" (click)="handleBackButton()">
            Cancelar
        </button>
        <button class="save">
            Salvar alterações
        </button>
    </div>
</div>
