<div class="page">
    <div class="header">
        <div style="display: flex; flex-direction: row;">
            <button class="back-button" (click)="handleBackButton()">
                ←
            </button>
            <h1>Editar membro</h1>
        </div>
        <!-- TODO: finalizar esse componente, está próximo bem próximo -->
        <!-- A ideia é montar o modal com somente os cargos possíveis para aquele user,
         lembrando de não poder trocar o Principal (proprietario da instituição) -->
        <button class="menu-button" type="button" [matMenuTriggerFor]="memberMenu" aria-label="Opções do membro">
            <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #memberMenu="matMenu">
            <button mat-menu-item [matMenuTriggerFor]="roleMenu">
                <mat-icon>manage_accounts</mat-icon>
                <span>Alterar função</span>
            </button>

            <button mat-menu-item (click)="toggleUserStatus()">
                <mat-icon>
                    {{ 'person_off' }}
                </mat-icon>
                <span>
                    {{ 'Desativar usuário' }}
                </span>
            </button>
        </mat-menu>

        <mat-menu #roleMenu="matMenu">
            <button mat-menu-item (click)="changeRole()">
                <span>Aluno</span>
            </button>

            <button mat-menu-item (click)="changeRole()">
                <span>Professor</span>
            </button>

            <button mat-menu-item (click)="changeRole()">
                <span>Coordenador</span>
            </button>

            <button mat-menu-item (click)="changeRole()">
                <span>Diretor</span>
            </button>
        </mat-menu>
    </div>

    <div class="profile-card">
        @if (this.user()?.profilePhoto) {
        <img [src]="this.user()?.profilePhoto" class="avatar">
        } @else {
        <img src="https://i.pravatar.cc/180" class="avatar">
        }
        <div class="info">
            <h2>{{ user()?.name || '-' }}</h2>
            <p>{{ user()?.email || '-' }}</p>
            <p>{{ user()?.birth || '-' }}</p>
            <div class="role">
                <label>{{ this.user()?.companies?.[0]?.role || '-' }} @ {{
                    this.user()?.companies?.[0]?.companyName ||
                    '-' }}</label>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Turmas</h2>
            <button>
                + Alocar em turma
            </button>
        </div>

        <div class="class-list">
            <div class="class-card">
                <div>
                    <h3>3º Ano A</h3>
                    <span>28 alunos</span>
                </div>
                <button class="remove">
                    Remover
                </button>
            </div>

            <div class="class-card">
                <div>
                    <h3>2º Ano B</h3>
                    <span>31 alunos</span>
                </div>

                <button class="remove">
                    Remover
                </button>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="cancel" (click)="handleBackButton()">
            Cancelar
        </button>
        <button class="save">
            Salvar alterações
        </button>
    </div>
</div>
