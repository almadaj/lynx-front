<div class="create-page">
    <header class="page-header">
        <button type="button" class="back-button" (click)="cancel()">
            <mat-icon>arrow_back</mat-icon>
            Voltar
        </button>

        <div>
            <h1>Nova questão</h1>
            <p>Cadastre uma nova questão no banco de questões.</p>
        </div>
    </header>

    <app-question-form [loading]="loading()" (submitted)="createQuestion($event)" (cancelled)="cancel()"
        (validationFailed)="onValidationFailed()" />
</div>
