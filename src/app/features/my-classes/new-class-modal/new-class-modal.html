<app-common-modal [isOpen]="isOpen" [title]="'Adicionar Nova Turma'" [cancelButtonText]="'Fechar'"
    [confirmButtonText]="'Adicionar Turma'" (close)="closeModal()" (cancel)="closeModal()"
    (confirm)="step() === 'form-one' ? confirmModal() : confirmAssociation()">

    @if (step() === 'form-one') {
    <div class="social-form">
        <div>
            <label class="label">Digite o nome da turma:</label>
            <input class="input" type="text" [value]="newClass()?.name ?? ''" (input)="newClass.set($any({
            ...newClass(),
            name: $any($event.target).value
                }))" placeholder="Ex: Turma B" />
        </div>

        <div style="display: flex; justify-content: space-between; gap: 12px;">
            <div style="flex: 1;">
                <label class="label">Instituição:</label>
                <select class="input" [value]="company()" (change)="company.set($any($event.target).value)">
                    <option value="">Selecione...</option>

                    @for (company of principalCompanies(); track company.companyId) {
                    <option [value]="company.companyId">
                        {{ company.publicName }}
                    </option>
                    }
                </select>
            </div>
        </div>
        <div>
            <label class="label">Professor:</label>
            <input class="input" type="number" [value]="newClass()?.maxStudents ?? '0'" (input)="newClass.set($any({
            ...newClass(),
            maxStudents: $any($event.target).value
                }))" />
        </div>
    </div>
    }@else if (step() === 'form-two'){
    <div class="social-form">
        <div class="same-row">
            <div>
                <label class="label">Idioma:</label>
                <input class="input" type="number" [value]="newClass()?.maxStudents ?? '0'" (input)="newClass.set($any({
            ...newClass(),
            maxStudents: $any($event.target).value
                }))" />
            </div>
            <div>
                <label class="label">Nível:</label>
                <input class="input" type="number" [value]="newClass()?.maxStudents ?? '0'" (input)="newClass.set($any({
            ...newClass(),
            maxStudents: $any($event.target).value
                }))" />
            </div>
            <div>
                <label class="label">Número máximo de alunos:</label>
                <input class="input" type="number" min="1" [value]="newClass()?.maxStudents ?? '1'" (input)="newClass.set($any({
            ...newClass(),
            maxStudents: $any($event.target).value
                }))" />
            </div>
        </div>
        <div>
            <label class="label">Professor:</label>
            <input class="input" type="number" [value]="newClass()?.maxStudents ?? '0'" (input)="newClass.set($any({
            ...newClass(),
            maxStudents: $any($event.target).value
                }))" />
        </div>
        <div class="same-row">
            <div>
                <label class="label">Data de início:</label>
                <input class="input" type="date" [value]="newClass()?.startDate ?? ''" (input)="newClass.set($any({...newClass(),
                    startDate: $any($event.target).value
                }))" />
            </div>
            <div>
                <label class="label">Data de fim:</label>
                <input class="input" type="date" [value]="newClass()?.endDate ?? ''" />
            </div>
        </div>
    </div>
    }
    @else {
    <p class="confirm-text">Você tem certeza que deseja criar a turma
        <strong>{{newClass()?.name }}</strong>
        para a instituição
        <strong>{{ selectedCompany()?.companyName }}
        </strong>?
    </p>
    }
    <p style="margin-top: 15px; margin-bottom: 0; color: #ff0000;">{{errorMessage()}}</p>
</app-common-modal>
