@if (isOpen) {
<div class="modal-overlay" (click)="onOverlayClick()">
    <div class="modal-container" role="dialog" aria-modal="true" [attr.aria-label]="title" tabindex="-1"
        (click)="$event.stopPropagation()">

        <!-- Header com Close Button opcional -->
        <div class="modal-header">
            <h2 class="modal-title">{{ title }}</h2>
            @if (showClose) {
            <button class="modal-close-btn" (click)="onClose()" type="button" aria-label="Fechar modal">
                ✕
            </button>
            }
        </div>

        <!-- Conteúdo do Modal -->
        <div class="modal-body">
            @if(contentComponent){
            <ng-container *ngComponentOutlet="contentComponent"></ng-container>
            } @else {
            <ng-content></ng-content>
            }
        </div>

        <div class="modal-footer">
            @if(showCancel){
            <button class="btn btn-secondary" (click)="onCancel()" type="button">
                {{ cancelButtonText }}
            </button>
            }
            @if (showConfirm) {
            <button class="btn btn-primary" (click)="onConfirm()" type="button">
                {{ confirmButtonText }}
            </button>
            }
        </div>
    </div>
</div>
}
